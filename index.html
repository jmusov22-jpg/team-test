<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamChat</title>
  </head>
  <body>
    <header>
      <h1>TeamChat</h1>
    </header>

    <main>
      <aside aria-labelledby="chats-heading">
        <h2 id="chats-heading">Чати</h2>
        <ul>
          <li>
            <button type="button" aria-pressed="true">
              <span class="avatar" aria-hidden="true">ОМ</span>
              <span>
                <span>Олена Мельник</span>
                <span>Привіт! Як справи?</span>
              </span>
              <time datetime="2026-10-31T14:10">14:10</time>
            </button>
          </li>
          <li>
            <button type="button" aria-pressed="false">
              <span class="avatar" aria-hidden="true">АК</span>
              <span>
                <span>Андрій Коваль</span>
                <span>Дякую за допомогу!</span>
              </span>
              <time datetime="2026-10-31T13:42">13:42</time>
            </button>
          </li>
          <li>
            <button type="button" aria-pressed="false">
              <span class="avatar" aria-hidden="true">ІП</span>
              <span>
                <span>Ірина Петренко</span>
                <span>До зустрічі завтра</span>
              </span>
              <time datetime="2026-10-30T18:25">Вчора</time>
            </button>
          </li>
        </ul>
      </aside>

      <section aria-labelledby="conversation-heading">
        <header>
          <span class="avatar" aria-hidden="true">ОМ</span>
          <h2 id="conversation-heading">Олена Мельник</h2>
        </header>

        <ol aria-label="Повідомлення">
          <li>
            <article>
              <p><strong>Олена Мельник</strong></p>
              <p>Привіт! Як справи?</p>
              <time datetime="2026-10-31T14:10">14:10</time>
            </article>
          </li>
          <li>
            <article>
              <p><strong>Ви</strong></p>
              <p>Привіт! Усе добре, дякую. А в тебе?</p>
              <time datetime="2026-10-31T14:12">14:12</time>
            </article>
          </li>
        </ol>

        <form>
          <label for="message">Повідомлення</label>
          <input id="message" name="message" type="text" placeholder="Напишіть повідомлення...">
          <button type="submit">Надіслати</button>
        </form>
      </section>
    </main>
  </body>
</html>
