<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>TeamChat</h1>
    </header>

    <main class="chat-app">
      <aside class="chat-sidebar" aria-labelledby="chats-heading">
        <div class="sidebar-heading">
          <h2 id="chats-heading">Чати</h2>
          <span class="chat-count" id="chat-count" aria-label="Кількість чатів"></span>
        </div>
        <button class="create-group-button" id="create-group-button" type="button">+ Створити групу</button>
        <form class="group-form" id="group-form" hidden>
          <label for="group-name">Назва групи</label>
          <input id="group-name" name="group-name" type="text" maxlength="40" placeholder="Наприклад, Команда" required>
          <label for="group-members">Учасники</label>
          <select id="group-members" name="group-members" multiple required></select>
          <div class="group-form-actions">
            <button class="tool-button" id="cancel-group" type="button">Скасувати</button>
            <button class="create-group-submit" type="submit">Створити</button>
          </div>
        </form>
        <div class="chat-search-wrap">
          <label class="visually-hidden" for="chat-search">Пошук чату</label>
          <input id="chat-search" class="chat-search" type="search" placeholder="Пошук чату..." autocomplete="off" aria-label="Пошук чатів">
        </div>
        <ul class="chat-list" id="chat-list" aria-label="Список чатів"></ul>
      </aside>

      <section class="conversation" aria-labelledby="conversation-heading">
        <header class="conversation-header">
          <span class="avatar" id="conversation-avatar" aria-hidden="true"></span>
          <div>
            <h2 id="conversation-heading"></h2>
            <p id="conversation-status"></p>
          </div>
        </header>

        <ol class="messages" id="messages" aria-label="Повідомлення" aria-live="polite"></ol>

        <form class="message-form" id="message-form">
          <div class="message-options">
            <label class="auto-translate" for="auto-translate">
              <input id="auto-translate" type="checkbox">
              Автопереклад українською
            </label>
            <button class="tool-button" id="improve-message" type="button">Покращити за допомогою ШІ</button>
          </div>
          <p class="feature-status" id="feature-status" role="status" aria-live="polite"></p>
          <label class="visually-hidden" for="message">Повідомлення</label>
          <div class="message-compose-row">
            <input id="message" name="message" type="text" placeholder="Напишіть повідомлення..." autocomplete="off" required>
            <button class="tool-button" id="record-voice" type="button">Записати голос</button>
            <button type="submit">Надіслати</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
