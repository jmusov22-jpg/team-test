<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>TeamChat</h1>
    </header>

    <main class="chat-app">
      <aside class="chat-sidebar" aria-labelledby="chats-heading">
        <div class="sidebar-heading">
          <h2 id="chats-heading">Чати</h2>
          <span class="chat-count" id="chat-count" aria-label="Кількість чатів"></span>
        </div>
        <section class="account-section" aria-label="Профіль і контакти">
          <button class="create-group-button" id="profile-toggle" type="button">Мій профіль</button>
          <form class="account-form" id="profile-form" hidden>
            <h3>Профіль</h3>
            <div class="profile-preview">
              <span class="avatar avatar-blue" id="profile-preview-avatar" aria-hidden="true">В</span>
              <span id="profile-preview-name">Мій профіль</span>
            </div>
            <label for="profile-name">Ім’я</label>
            <input id="profile-name" type="text" maxlength="40" required>
            <label for="profile-phone">Номер телефону</label>
            <input id="profile-phone" type="tel" autocomplete="tel">
            <label for="profile-email">Імейл</label>
            <input id="profile-email" type="email" autocomplete="email">
            <label for="profile-avatar">Аватар (емодзі або ініціали)</label>
            <input id="profile-avatar" type="text" maxlength="4" required>
            <label for="profile-color">Колір</label>
            <select id="profile-color">
              <option value="blue">Синій</option>
              <option value="coral">Кораловий</option>
              <option value="purple">Фіолетовий</option>
              <option value="green">Зелений</option>
              <option value="gold">Золотий</option>
            </select>
            <label for="profile-code">Секретний код</label>
            <div class="code-row">
              <input id="profile-code" type="text" readonly aria-label="Ваш секретний код">
              <button class="tool-button" id="generate-code" type="button">Створити</button>
            </div>
            <button class="create-group-submit" type="submit">Зберегти профіль</button>
          </form>

          <button class="create-group-button" id="add-contact-button" type="button">+ Додати контакт</button>
          <form class="account-form" id="contact-form" hidden>
            <h3>Новий контакт</h3>
            <label for="contact-name">Ім’я контакту</label>
            <input id="contact-name" type="text" maxlength="40" required>
            <label for="contact-phone">Номер телефону</label>
            <input id="contact-phone" type="tel" autocomplete="off">
            <label for="contact-email">Імейл</label>
            <input id="contact-email" type="email" autocomplete="off">
            <label for="contact-code">Секретний код</label>
            <input id="contact-code" type="text" autocomplete="off" maxlength="24">
            <p class="form-hint">Укажіть хоча б один ідентифікатор контакту.</p>
            <div class="group-form-actions">
              <button class="tool-button" id="cancel-contact" type="button">Скасувати</button>
              <button class="create-group-submit" type="submit">Додати</button>
            </div>
          </form>
        </section>
        <button class="create-group-button" id="create-group-button" type="button">+ Створити групу</button>
        <form class="group-form" id="group-form" hidden>
          <label for="group-name">Назва групи</label>
          <input id="group-name" name="group-name" type="text" maxlength="40" placeholder="Наприклад, Команда" required>
          <label for="group-members">Учасники</label>
          <select id="group-members" name="group-members" multiple required></select>
          <div class="group-form-actions">
            <button class="tool-button" id="cancel-group" type="button">Скасувати</button>
            <button class="create-group-submit" type="submit">Створити</button>
          </div>
        </form>
        <div class="chat-search-wrap">
          <label class="visually-hidden" for="chat-search">Пошук чатів і повідомлень</label>
          <input id="chat-search" class="chat-search" type="search" placeholder="Пошук чатів і повідомлень..." autocomplete="off" aria-label="Пошук чатів і повідомлень">
        </div>
        <ul class="chat-list search-results" id="search-results" aria-label="Результати пошуку" hidden></ul>
        <ul class="chat-list" id="chat-list" aria-label="Список чатів"></ul>
      </aside>

      <section class="conversation" aria-labelledby="conversation-heading">
        <header class="conversation-header">
          <span class="avatar" id="conversation-avatar" aria-hidden="true"></span>
          <div>
            <h2 id="conversation-heading"></h2>
            <p id="conversation-status"></p>
          </div>
        </header>

        <ol class="messages" id="messages" aria-label="Повідомлення" aria-live="polite"></ol>

        <form class="message-form" id="message-form">
          <div class="message-options">
            <label class="auto-translate" for="auto-translate">
              <input id="auto-translate" type="checkbox">
              Автопереклад українською
            </label>
            <button class="tool-button" id="improve-message" type="button">Покращити за допомогою ШІ</button>
          </div>
          <p class="feature-status" id="feature-status" role="status" aria-live="polite"></p>
          <label class="visually-hidden" for="message">Повідомлення</label>
          <div class="message-compose-row">
            <div class="message-input-wrap">
              <textarea id="message" name="message" placeholder="Напишіть повідомлення..." autocomplete="off" rows="1" required></textarea>
              <button class="sticker-toggle" id="sticker-toggle" type="button" aria-label="Відкрити стікери" aria-haspopup="true" aria-expanded="false" aria-controls="sticker-picker">😊</button>
              <div class="sticker-picker" id="sticker-picker" role="group" aria-label="Вибір стікера" hidden>
                <p class="sticker-picker-title">Оберіть стікер</p>
                <div class="sticker-grid" id="sticker-grid"></div>
              </div>
            </div>
            <button class="tool-button" id="record-voice" type="button">Записати голос</button>
            <button type="submit">Надіслати</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
